<!DOCTYPE html>
<html>
    <head>
        <title>signup page</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            h2{
                text-align: center;
                display: block;
                background-color: violet;
                color: aliceblue;
            }
            body{
                background-image: url('background-signup.png');

            }
            .notes p{
                text-align: center;
                margin: 20px;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }
            p{
                text-align: center;
                color: cornsilk;
            }
            form{
                max-width: fit-content;
                border: 1px solid black;
                border-radius: 4px;
                margin: 30px auto;
                padding: 20px;;
                box-shadow: 0px 1px 4px 2px black;
                line-height: 1.8;
                
            }
            p a:hover{
                color: lightcyan;
                background-color: turquoise;
            }
            input{
                width: 100%;
                background-color: lightskyblue;
                padding: 5px;
                display: block;
            }
            button{
                display: block;
                margin: 10px auto 0px;
                color: white;
                background-color: green;
                border-radius: 4px;
                padding: 5px;
            }
            label{
                color: darkblue;
                display: block;
            }

            button:hover{
                color: lightcyan;
                background-color: turquoise;
            }
               
            
            @media (min-width: 600px) {
            body {
                padding-bottom: 60px;
            }
            form {
                padding: 30px;       
                margin: 40px auto;
            }
            .notes p {
                font-size: 1.2rem;   
            }
        }

        @media (min-width: 900px) {
            form {
                max-width: 460px;    
                padding: 35px;
            }
        }
            
            
        </style>
    </head>
    <body>
        <h2>Create account</h2>
        <div class="notes">
        <p><q>Excercise not only changes your body, it changes your attitude and mood</q></p>
        </div>
        <form action="login_page.html" method="post">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required>

            <label for="mail">Email</label>
            <input type="email" id="mail" name="mail" required>

            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" required>

            <label for="conpass">Confirm password</label>
            <input type="password" id="conpass" name="conpass" required>

            <button type="submit">Create account</button>


        </form>
        
        <p>already have an account <a href="login_page.html">login</a></p>
    </body>
</html>
