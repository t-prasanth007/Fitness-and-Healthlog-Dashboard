<!DOCTYPE html>
<html>
    <head>
        <style>
             *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            .main_container{
                display: flex;
                width: 100vw;
                height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                 background: #0d0d0d;
                overflow: hidden;
            }
            
            .image_container{
                width: 50%;
                height: 100%;
                background-image: url('health.avif');
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center;
                
                
            }
            .login_container{
                width: 50%;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #1f0006, #4a000e);
                color: #ffffff;
                padding: 60px;
            }
            .login_container h2{
                font-size: 56px;
                font-weight: 900;
                color: #ff2a5f;
                margin-bottom: 30px;
                line-height: 1.1;
            }
           
            .form-container{
                border: 1px solid black;
                padding: 10px;
            }

            .form-container .btn{
                background: #ffffff;
                color: #4a000e;
                padding: 16px 40px;
                font-size: 18px;
                font-weight: 700;
                text-decoration: none;
                border-radius: 4px;
                align-items: center;
                display: block;
                transition: all 0.3s ease;
                margin: 0px auto;               
            }
            .form-container .btn:hover{
                background: #ff2a5f;
                color: #ffffff;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(255, 42, 95, 0.5);
            }
             @media (max-width: 1024px) {
            .login_container {
                padding: 40px; 
            }
            .login_container h2 {
                font-size: 38px; 
            }
            form {
                max-width: 340px;
            }
        }

        
        @media (max-width: 767px) {
            .main_container {
                flex-direction: column; 
                overflow-y: auto; 
                height: auto; 
            }
            .image_container {
                width: 100%;
                height: 30vh; 
                background-position: center;
            }
            .login_container {
                width: 100%;
                height: auto; 
                padding: 40px 24px;
            }
            .login_container h2 {
                font-size: 32px;
                margin-bottom: 20px;
            }
            form {
                max-width: 100%; 
            }
            input {
                padding: 12px 14px; 
                font-size: 15px;
            }
            .btn {
                padding: 14px 30px;
                font-size: 16px;
            }
        }
                
                
            
        </style>
    </head>
    <body>
        <div class="main_container">
            <div class="image_container"></div>
            <div class="login_container">
               <h2>welcome to login page</h2>
               <div class="form-container">
        <form action="Fitness_healthlog_Project.html" method="get">
            <label for="name">full name</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="pass">password</label>
            <input type="password" id="pass" name="pass" required><br><br>

            <button type="submit" class="btn">login</button>

        </form>
        </div>
        <p>don't have an account <a href="signup.html">sign up</a> </p>
        </div>
        </div>
    </body>

    </html>
